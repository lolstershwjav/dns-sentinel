[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dns-sentinel"
version = "0.1.0"
description = "Offline DNS tunneling anomaly triage using explainable features and Isolation Forest"
requires-python = ">=3.10"
dependencies = ["scikit-learn>=1.3,<2"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
dns-sentinel = "dnssentinel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
